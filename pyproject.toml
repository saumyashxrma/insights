[project]
name = "omninsight-workspace"
version = "0.0.1"
description = "OmniInsight monorepo — analytics for small e-commerce and retail businesses."
requires-python = ">=3.12"
readme = "README.md"

[tool.uv.workspace]
members = ["packages/core", "apps/api"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/core/src", "apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["\\.venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/api/tests"]
addopts = "-ra --strict-markers --strict-config"
